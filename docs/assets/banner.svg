<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">MediRAG · Dr. Insight</title>
  <desc id="d">Animated banner: a beating red cross and an ECG line, with the tagline Trust the source</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0c"/>
      <stop offset="1" stop-color="#220609"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2d3b" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff2d3b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#f3eee4" stroke-opacity="0.045"/>
    </pattern>
    <linearGradient id="trace" x1="0" x2="1">
      <stop offset="0" stop-color="#f3eee4" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#f3eee4"/>
      <stop offset="0.85" stop-color="#ff2d3b"/>
      <stop offset="1" stop-color="#ff2d3b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>

  <!-- beating cross -->
  <g transform="translate(1000 168)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.07;1;1.045;1;1" keyTimes="0;0.14;0.28;0.42;0.6;1" dur="1.4s" repeatCount="indefinite"/>
      <path d="M-34-130h68v96h96v68h-96v96h-68v-96h-96v-68h96z" fill="#ff2d3b"/>
    </g>
  </g>

  <!-- ECG trace -->
  <g transform="translate(0 322)">
    <path d="M0 0H170l14-9 14 9H250l8 10 15-58 15 74 10-26H360l22-14 22 14H590l14-9 14 9H680l8 10 15-58 15 74 10-26H780l22-14 22 14H1200"
          fill="none" stroke="url(#trace)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
          stroke-dasharray="1800" stroke-dashoffset="1800">
      <animate attributeName="stroke-dashoffset" values="1800;0;0" keyTimes="0;0.7;1" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="70" font-size="14" font-weight="700" fill="#ff2d3b" letter-spacing="5">EVIDENCE-BASED MEDICAL AI</text>
    <text x="62" y="152" font-family="Impact, Haettenschweiz, 'Arial Narrow Bold', sans-serif" font-size="92" fill="#f3eee4" letter-spacing="1">MEDIRAG</text>
    <text x="446" y="152" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="52" fill="#ff2d3b">Dr. Insight</text>
    <text x="66" y="194" font-size="21" fill="#b9b3a6">Trust the source. Every answer shows where it came from.</text>
    <g font-size="14" font-weight="700" letter-spacing="0.5">
      <rect x="66" y="218" width="176" height="32" rx="16" fill="none" stroke="#f3eee4" stroke-opacity="0.5"/>
      <text x="154" y="239" text-anchor="middle" fill="#f3eee4">RAG · hybrid search</text>
      <rect x="254" y="218" width="190" height="32" rx="16" fill="none" stroke="#f3eee4" stroke-opacity="0.5"/>
      <text x="349" y="239" text-anchor="middle" fill="#f3eee4">10 Indian languages</text>
      <rect x="456" y="218" width="140" height="32" rx="16" fill="#ff2d3b"/>
      <text x="526" y="239" text-anchor="middle" fill="#ffffff">safety-first</text>
      <rect x="608" y="218" width="200" height="32" rx="16" fill="none" stroke="#f3eee4" stroke-opacity="0.5"/>
      <text x="708" y="239" text-anchor="middle" fill="#f3eee4">voice · reports · vision</text>
    </g>
  </g>
</svg>
