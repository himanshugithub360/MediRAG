<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">MediRAG · Dr. Insight</title>
  <desc id="d">Animated ECG heartbeat banner for the MediRAG medical chatbot</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06121f"/>
      <stop offset="1" stop-color="#062b30"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#14d6b0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#14d6b0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#14d6b0" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="trace" x1="0" x2="1">
      <stop offset="0" stop-color="#14d6b0" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#14d6b0"/>
      <stop offset="0.85" stop-color="#5ee7ff"/>
      <stop offset="1" stop-color="#5ee7ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>

  <!-- ECG trace -->
  <g transform="translate(0 250)">
    <path id="ecg" d="M0 0 H160 l14 -10 14 10 H230 l8 12 14 -86 14 104 10 -30 H330 l20 -16 20 16
                       H520 l14 -10 14 10 H590 l8 12 14 -86 14 104 10 -30 H690 l20 -16 20 16
                       H880 l14 -10 14 10 H950 l8 12 14 -86 14 104 10 -30 H1050 l20 -16 20 16 H1200"
          fill="none" stroke="url(#trace)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"
          opacity="0.35" filter="url(#soft)"
          stroke-dasharray="1700" stroke-dashoffset="1700">
      <animate attributeName="stroke-dashoffset" values="1700;0;0" keyTimes="0;0.7;1" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M0 0 H160 l14 -10 14 10 H230 l8 12 14 -86 14 104 10 -30 H330 l20 -16 20 16
                       H520 l14 -10 14 10 H590 l8 12 14 -86 14 104 10 -30 H690 l20 -16 20 16
                       H880 l14 -10 14 10 H950 l8 12 14 -86 14 104 10 -30 H1050 l20 -16 20 16 H1200"
          fill="none" stroke="url(#trace)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
          stroke-dasharray="1700" stroke-dashoffset="1700">
      <animate attributeName="stroke-dashoffset" values="1700;0;0" keyTimes="0;0.7;1" dur="4s" repeatCount="indefinite"/>
    </path>
    <circle r="6" fill="#ffffff">
      <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.7;1" calcMode="linear">
        <mpath href="#ecg"/>
      </animateMotion>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.7;0.75" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect x="64" y="58" width="58" height="58" rx="16" fill="#14d6b0" fill-opacity="0.12" stroke="#14d6b0" stroke-width="2"/>
    <path d="M86 70h14v13h13v14h-13v13H86V97H73V83h13z" fill="#14d6b0"/>
    <text x="142" y="104" font-size="56" font-weight="800" fill="#e6f0f6" letter-spacing="-1.5">MediRAG</text>
    <text x="400" y="104" font-size="30" font-weight="500" fill="#8ea3b6">· Dr. Insight</text>
    <text x="66" y="156" font-size="22" fill="#b7c7d4">Evidence-based medical answers, with every source shown.</text>
    <g font-size="15" font-weight="600">
      <rect x="66" y="178" width="178" height="30" rx="15" fill="#14d6b0" fill-opacity="0.12" stroke="#14d6b0" stroke-opacity="0.5"/>
      <text x="155" y="198" text-anchor="middle" fill="#5eead4">RAG · hybrid search</text>
      <rect x="256" y="178" width="190" height="30" rx="15" fill="#6aa8ff" fill-opacity="0.12" stroke="#6aa8ff" stroke-opacity="0.5"/>
      <text x="351" y="198" text-anchor="middle" fill="#9cc4ff">10 Indian languages</text>
      <rect x="458" y="178" width="150" height="30" rx="15" fill="#ff6159" fill-opacity="0.12" stroke="#ff6159" stroke-opacity="0.5"/>
      <text x="533" y="198" text-anchor="middle" fill="#ff9a94">safety-first</text>
      <rect x="620" y="178" width="200" height="30" rx="15" fill="#ffb547" fill-opacity="0.12" stroke="#ffb547" stroke-opacity="0.5"/>
      <text x="720" y="198" text-anchor="middle" fill="#ffd08a">voice · reports · vision</text>
    </g>
  </g>

  <!-- Live readout -->
  <g font-family="Consolas, 'SF Mono', Menlo, monospace" text-anchor="end">
    <text x="1136" y="84" font-size="15" fill="#14d6b0" letter-spacing="2">● LIVE</text>
    <text x="1136" y="128" font-size="44" font-weight="700" fill="#e6f0f6">72<tspan font-size="18" fill="#8ea3b6"> bpm</tspan></text>
    <text x="1136" y="156" font-size="13" fill="#8ea3b6" letter-spacing="1.5">ANSWERS GROUNDED IN SOURCES</text>
  </g>
</svg>
