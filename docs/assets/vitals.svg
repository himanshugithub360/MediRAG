<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
  <title id="t">Project vital signs</title>
  <desc id="d">13,828 passages, 4 trusted sources, 10 languages, retrieval Hit@5 100 percent and MRR 0.87, 101 automated tests, about 240 MB RAM in lite mode, and 0 rupees hosting cost.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1626"/>
      <stop offset="1" stop-color="#07111d"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect x="2" y="2" width="1196" height="326" rx="22" fill="url(#bg)" stroke="#1f3247" stroke-width="3"/>
  <rect x="2" y="2" width="1196" height="326" rx="22" fill="url(#grid)"/>

  <g font-family="Consolas, 'SF Mono', Menlo, monospace">
    <text x="36" y="44" font-size="15" fill="#5b7186" letter-spacing="3">PATIENT: MEDIRAG · BED 01 · MONITORING</text>
    <circle cx="1146" cy="39" r="6" fill="#14d6b0">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="1130" y="44" font-size="15" fill="#14d6b0" text-anchor="end" letter-spacing="2">STABLE</text>
  </g>

  <!-- One readout = label (top-left), big value, unit, caption -->
  <g font-family="Consolas, 'SF Mono', Menlo, monospace">
    <!-- row 1 -->
    <g transform="translate(36 70)">
      <rect width="264" height="112" rx="14" fill="#14d6b0" fill-opacity="0.06" stroke="#14d6b0" stroke-opacity="0.35"/>
      <text x="18" y="28" font-size="13" fill="#14d6b0" letter-spacing="2">KNOWLEDGE</text>
      <text x="18" y="76" font-size="44" font-weight="700" fill="#5eead4">13,828</text>
      <text x="18" y="98" font-size="13" fill="#7f93a6">passages · 4 trusted sources</text>
    </g>
    <g transform="translate(320 70)">
      <rect width="264" height="112" rx="14" fill="#5ee7ff" fill-opacity="0.06" stroke="#5ee7ff" stroke-opacity="0.35"/>
      <text x="18" y="28" font-size="13" fill="#5ee7ff" letter-spacing="2">RETRIEVAL</text>
      <text x="18" y="76" font-size="44" font-weight="700" fill="#a5f3ff">100<tspan font-size="22">%</tspan></text>
      <text x="150" y="76" font-size="26" font-weight="700" fill="#a5f3ff">.87</text>
      <text x="18" y="98" font-size="13" fill="#7f93a6">Hit@5</text>
      <text x="150" y="98" font-size="13" fill="#7f93a6">MRR</text>
    </g>
    <g transform="translate(604 70)">
      <rect width="264" height="112" rx="14" fill="#6aa8ff" fill-opacity="0.06" stroke="#6aa8ff" stroke-opacity="0.35"/>
      <text x="18" y="28" font-size="13" fill="#6aa8ff" letter-spacing="2">LANGUAGES</text>
      <text x="18" y="76" font-size="44" font-weight="700" fill="#b8d4ff">10</text>
      <text x="80" y="76" font-size="20" fill="#b8d4ff">हि বা த తె …</text>
      <text x="18" y="98" font-size="13" fill="#7f93a6">English + 9 Indian languages</text>
    </g>
    <g transform="translate(888 70)">
      <rect width="276" height="112" rx="14" fill="#ff6159" fill-opacity="0.06" stroke="#ff6159" stroke-opacity="0.35"/>
      <text x="18" y="28" font-size="13" fill="#ff6159" letter-spacing="2">SAFETY</text>
      <text x="18" y="76" font-size="44" font-weight="700" fill="#ffaaa5">112</text>
      <text x="110" y="76" font-size="20" fill="#ffaaa5">108 · 14416</text>
      <text x="18" y="98" font-size="13" fill="#7f93a6">emergency &amp; crisis lines, instant</text>
    </g>
    <!-- row 2 -->
    <g transform="translate(36 198)">
      <rect width="264" height="100" rx="14" fill="#a78bfa" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.35"/>
      <text x="18" y="28" font-size="13" fill="#a78bfa" letter-spacing="2">TESTS</text>
      <text x="18" y="74" font-size="40" font-weight="700" fill="#d4c6ff">101<tspan font-size="18" fill="#8ea3b6"> passing</tspan></text>
    </g>
    <g transform="translate(320 198)">
      <rect width="264" height="100" rx="14" fill="#ffb547" fill-opacity="0.06" stroke="#ffb547" stroke-opacity="0.35"/>
      <text x="18" y="28" font-size="13" fill="#ffb547" letter-spacing="2">MEMORY (LITE)</text>
      <text x="18" y="74" font-size="40" font-weight="700" fill="#ffd89a">~240<tspan font-size="18" fill="#8ea3b6"> MB</tspan></text>
    </g>
    <g transform="translate(604 198)">
      <rect width="264" height="100" rx="14" fill="#34d399" fill-opacity="0.06" stroke="#34d399" stroke-opacity="0.35"/>
      <text x="18" y="28" font-size="13" fill="#34d399" letter-spacing="2">HOSTING COST</text>
      <text x="18" y="74" font-size="40" font-weight="700" fill="#a7f3d0">₹0<tspan font-size="18" fill="#8ea3b6"> / month</tspan></text>
    </g>
    <!-- pulse strip -->
    <g transform="translate(888 198)">
      <rect width="276" height="100" rx="14" fill="#14d6b0" fill-opacity="0.04" stroke="#14d6b0" stroke-opacity="0.25"/>
      <text x="18" y="28" font-size="13" fill="#14d6b0" letter-spacing="2">PULSE</text>
      <path d="M14 70 H70 l10 -8 10 8 H112 l6 10 10 -48 10 58 8 -20 H180 l14 -10 14 10 H262"
            fill="none" stroke="#14d6b0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
            stroke-dasharray="330" stroke-dashoffset="330">
        <animate attributeName="stroke-dashoffset" values="330;0;0" keyTimes="0;0.6;1" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
