name: CI

# Runs on every push and pull request. Render deploys main automatically once these checks
# pass (render.yaml: autoDeployTrigger: checksPass), so a broken commit never goes live.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      # The tests use fake AI services: no API keys, model downloads or network needed
      - name: Run tests
        run: python -m pytest -q

  docker:
    name: Docker image builds (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - name: full
            dockerfile: Dockerfile
          - name: render
            dockerfile: Dockerfile.render
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: medirag-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
