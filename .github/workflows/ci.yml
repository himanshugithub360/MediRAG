name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      # The tests use fake AI services: no API keys, model downloads or network needed
      - name: Run tests
        run: python -m pytest -q

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: medirag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hugging Face Space
    runs-on: ubuntu-latest
    needs: [test, docker]
    # Deploy on pushes to main, and when started by hand with "Run workflow" on main
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
    steps:
      - name: Check deployment is configured
        id: check
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_ID" ]; then
            echo "::notice::Skipping deploy: add the HF_TOKEN secret and HF_SPACE_ID variable (see README > Deployment)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.configured == 'true'
        with:
          python-version: "3.12"

      - name: Upload to the Space
        if: steps.check.outputs.configured == 'true'
        run: |
          pip install "huggingface_hub>=0.25"
          python deploy/deploy_to_hf.py
